# Writes Market News article briefs before readers open the stories. The steps
# live in scripts/news-briefs.sh so any other scheduler can run the same thing.
# Skipped until the SITE_URL repository variable is set; also needs the CRON_SECRET
# secret, matching the value on the site. Each run calls Claude for at most 15
# new stories (see MAX_PER_RUN in src/lib/news/prewrite.ts).
name: news-briefs

on:
  schedule:
    # Every 30 minutes, 06:00 to 19:30 Eastern (10:00 to 23:30 UTC), weekdays.
    - cron: "*/30 10-23 * * 1-5"
    # Every two hours otherwise.
    - cron: "0 0-9/2 * * 1-5"
    - cron: "0 */2 * * 0,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-briefs

jobs:
  prewrite:
    name: Write article briefs ahead
    if: ${{ vars.SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/news-briefs.sh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
